<!-- start custom analytics snippet -->
{% if site.analytics.goatcounter and site.analytics.goatcounter.code and site.analytics.goatcounter.code != "" %}
<script
  data-goatcounter="https://{{ site.analytics.goatcounter.code }}.goatcounter.com/count"
  async
  src="{{ site.analytics.goatcounter.script | default: '//gc.zgo.at/count.js' }}">
</script>
{% endif %}

<!-- end custom analytics snippet -->
