about:
  bio:
    - "I am a third-year PhD student in Computer Science at The Chinese University of Hong Kong, Shenzhen, and I am fortunate to be advised by <a href=\"https://mypage.cuhk.edu.cn/academics/yutianshu/\" target=\"_blank\" rel=\"noopener noreferrer\">Prof. Tianshu Yu</a>. During my PhD, I also spent time as a visiting student at the Institute of Automation, Chinese Academy of Sciences, hosted by <a href=\"https://ia.cas.cn/rcdw/yjy/202404/t20240422_7129885.html\" target=\"_blank\" rel=\"noopener noreferrer\">Prof. Shu Wu</a>, and as a research intern at Shanghai Artificial Intelligence Laboratory."
    - "Before my PhD, I completed an M.S. in Data Science at City University of Hong Kong under the supervision of <a href=\"https://rguo12.github.io/\" target=\"_blank\" rel=\"noopener noreferrer\">Dr. Ruocheng Guo</a> and a B.S. in Computer Science at Shandong University under the supervision of <a href=\"https://xuemengsong.github.io/\" target=\"_blank\" rel=\"noopener noreferrer\">Prof. Xuemeng Song</a>."
    - "I am interested in graph learning, graph-augmented intelligence, and impactful applications in science and industry."

research_themes:
  - title: "Vision-Native Structural Understanding"
    question: "Can vision models recover graph topology and higher-order structure without explicit message passing?"
    method: "Cross-modal probing, structure-sensitive evaluation, and model behavior analysis."
    application: "Unified reasoning over visualized scientific/engineering structures."
  - title: "Efficient and Robust Graph Representation Learning"
    question: "How can graph embeddings remain useful under perturbation, distribution shift, and limited supervision?"
    method: "Contrastive learning, augmentation design, and topology-aware regularization."
    application: "Scalable learning for sparse, noisy, and dynamic graph data."
  - title: "Benchmarking for Graph Reasoning Agents"
    question: "What capabilities do LLM-centered systems truly have on graph-theoretic tasks?"
    method: "Large-scale benchmark construction, taxonomy design, and diagnostic task suites."
    application: "Trustworthy evaluation for graph-capable foundation models."
  - title: "AI4Science and Real-World Decision Systems"
    question: "How can structured priors improve sample efficiency and scientific validity?"
    method: "Negative sample mining, structural constraints, and domain-aware model adaptation."
    application: "Protein modeling, recommendation systems, and industrial optimization."

papers:
  - id: "forge-manufacturing"
    title: "FORGE: Fine-grained Multimodal Evaluation for Manufacturing Scenarios"
    authors: "Xiangru Jian, Hao Xu, Wei Pang, Xinjian Zhao, Chengyu Tao, Qixin Zhang, Xikun Zhang, Chao Zhang, Guanzhi Deng, Alex Xue, Juan Du, Tianshu Yu, Garth Tarr, Linqi Song, Qiuzhuang Sun, Dacheng Tao"
    venue_full: "Preprint"
    year: 2026
    accent: "#8f5b2e"
    teaser_label: "Manufacturing MLLMs"
    teaser_caption: "Fine-grained multimodal evaluation in industrial scenarios"
    links:
      - label: "Paper"
        url: "https://arxiv.org/abs/2604.07413"
      - label: "Website"
        url: "https://ai4manufacturing.github.io/forge-web/"
    summary:
      - "We introduce FORGE, a fine-grained multimodal benchmark for manufacturing that combines real-world 2D images and 3D point clouds with domain-specific semantic annotations."
      - "Evaluating 18 state-of-the-art MLLMs across workpiece verification, surface inspection, and assembly verification reveals that domain knowledge, rather than visual grounding alone, is the key bottleneck."
    key_insight: "In manufacturing MLLMs, domain-specific knowledge is often a more critical bottleneck than raw visual grounding."
    why_it_matters: "It provides a realistic evaluation and adaptation pathway for multimodal models in industrial environments."
    trajectory_relation: "This work extends my interest in graph-augmented intelligence and structured evaluation into high-value manufacturing scenarios."
    tags: ["Manufacturing", "MLLM", "Benchmark"]

  - id: "vision-graphs-survey"
    title: "When Vision Meets Graphs: A Survey on Graph Reasoning and Learning"
    authors: "Xinjian Zhao, Wei Pang, Zhixuan Yu, Xiangru Jian, Xiaozhuang Song, Yaoyao Xu, Zhongkai Xue, Dingshuo Chen, Shu Wu, Philip Torr, Tianshu Yu"
    venue_full: "The 35th International Joint Conference on Artificial Intelligence (IJCAI) Survey Track"
    year: 2026
    accent: "#3b5bdb"
    teaser_label: "Synthesis Layer"
    teaser_caption: "Unifying trends across vision and graph learning"
    links:
      - label: "Paper"
        url: "https://www.techrxiv.org/doi/full/10.36227/techrxiv.177004261.15861585/v1"
    summary:
      - "This survey provides a first systematic consolidation of the emerging 'When Vision Meets Graphs' area, where graph depictions are treated as first-class inputs."
      - "Using the RPI lens and a three-thread taxonomy, it organizes fragmented literature and outlines concrete future directions toward graph foundation models."
    key_insight: "Treating visualized graphs as computational objects, not just illustrations, opens a coherent new research agenda."
    why_it_matters: "It clarifies a forward research agenda and identifies where new benchmarks and models are most needed."
    trajectory_relation: "This is a synthesis node that integrates observations from multiple branches of my prior work."
    tags: ["Survey", "Vision", "Graph ML"]

  - id: "vision-power"
    title: "The Underappreciated Power of Vision Models for Graph Structural Understanding"
    authors: "Xinjian Zhao*, Wei Pang*, Zhongkai Xue*, Xiangru Jian*, Lei Zhang, Yaoyao Xu, Xiaozhuang Song, Shu Wu, Tianshu Yu"
    venue_full: "Conference on Neural Information Processing Systems"
    venue_abbr: "NeurIPS"
    year: 2025
    accent: "#495057"
    teaser_label: "Structure via Pixels"
    teaser_caption: "How far vision models can reason about graph structure"
    links:
      - label: "Paper"
        url: "https://arxiv.org/pdf/2510.24788"
    summary:
      - "For the first time, we conduct a controlled comparison between pure vision backbones and GNNs for graph structural understanding, and introduce GraphAbstract to isolate topology reasoning."
      - "Pure vision models achieve comparable overall performance and outperform GNNs on holistic structure tasks with stronger cross-scale generalization."
    key_insight: "For global topology abstraction, a global-first visual inductive bias can be stronger than local message passing."
    why_it_matters: "It opens a practical route to leverage mature vision architectures for graph reasoning tasks."
    trajectory_relation: "This paper extends the GraphOmni diagnosis into model-side evidence about where structural reasoning emerges."
    tags: ["Vision Models", "Structural Reasoning", "NeurIPS"]

  - id: "graphomni"
    title: "GraphOmni: A Comprehensive and Extendable Benchmark Framework for Large Language Models on Graph-theoretic Tasks"
    authors: "Hao Xu*, Xiangru Jian*, Xinjian Zhao*, Wei Pang*, Chao Zhang, Suyucheng Wang, Qixin Zhang, Zhengyuan Dong, Joao Monteiro, Bang Liu, Qiuzhuang Sun, Tianshu Yu"
    venue_full: "International Conference on Learning Representations"
    venue_abbr: "ICLR"
    year: 2026
    accent: "#0b7285"
    teaser_label: "Benchmark Taxonomy"
    teaser_caption: "Graph-theoretic capabilities of LLM systems"
    links:
      - label: "Paper"
        url: "https://arxiv.org/abs/2504.12764"
    summary:
      - "We introduce GraphOmni, a modular benchmark that factorizes graph-theoretic reasoning by graph type, serialization format, and prompting strategy."
      - "Large-scale evaluation reveals strong interactions among these factors and substantial capability gaps that are hidden by single-score comparisons."
    key_insight: "Graph reasoning is conditional on representation and prompting choices, so evaluation must be factorized rather than leaderboard-style."
    why_it_matters: "It provides a more reliable basis for comparing model families and choosing where algorithmic effort should go."
    trajectory_relation: "This work establishes the evaluation spine for my later studies on structure understanding and model bias."
    tags: ["LLM", "Graph Reasoning", "Benchmark"]

  - id: "distributional-layouts"
    title: "Graph Learning with Distributional Edge Layouts"
    authors: "Xinjian Zhao, Chaolong Ying, Yaoyao Xu, Tianshu Yu"
    venue_full: "ACM SIGKDD Conference on Knowledge Discovery and Data Mining"
    venue_abbr: "KDD"
    year: 2025
    accent: "#087f5b"
    teaser_label: "Distributional Geometry"
    teaser_caption: "Edge layout distributions as structural priors"
    links:
      - label: "Paper"
        url: "https://arxiv.org/abs/2402.16402"
    summary:
      - "We propose Distributional Edge Layouts (DEL), modeling graph topology as a distribution by globally sampling edge layouts with Langevin dynamics under Boltzmann energy."
      - "As a model-agnostic preprocessing module, DEL consistently improves diverse GNN backbones and reaches strong state-of-the-art performance on multiple datasets."
    key_insight: "Modeling topology as a distribution, rather than a fixed graph, is a practical path to robustness and extra expressivity."
    why_it_matters: "Many real data pipelines induce imperfect graphs; distributional layouts make methods less brittle in those settings."
    trajectory_relation: "This is a core branch in my trajectory on robust graph representation under imperfect structure."
    tags: ["Graph Representation", "Robustness", "KDD"]

  - id: "spectral-augmentation"
    title: "Rethinking Spectral Augmentation for Contrast-based Graph Self-Supervised Learning"
    authors: "Xiangru Jian*, Xinjian Zhao*, Wei Pang*, Chaolong Ying, Yimu Wang, Yaoyao Xu, Tianshu Yu"
    venue_full: "Transactions on Machine Learning Research"
    venue_abbr: "TMLR"
    year: 2025
    accent: "#5f3dc4"
    teaser_label: "Spectral Views"
    teaser_caption: "Augmentation choices in graph contrastive learning"
    links:
      - label: "Paper"
        url: "https://openreview.net/pdf?id=HjpD5kpfa3"
    summary:
      - "We re-examine spectral augmentation in contrastive graph self-supervised learning via broad empirical studies and theoretical analysis of InfoNCE bounds."
      - "Simple edge perturbations (edge dropping for node-level, edge adding for graph-level) often match or outperform spectral methods with much lower computational cost."
    key_insight: "In graph SSL, choosing invariances well matters more than increasingly complex spectral engineering."
    why_it_matters: "It improves SSL stability and reduces trial-and-error in representation learning pipelines."
    trajectory_relation: "This contributes mechanistic understanding in my branch on efficient, principled representation learning."
    tags: ["Graph SSL", "Spectral Methods", "TMLR"]

  - id: "protein-negative-mining"
    title: "Boosting Protein Language Models with Negative Sample Mining"
    authors: "Yaoyao Xu*, Xinjian Zhao*, Xiaozhuang Song, Benyou Wang, Tianshu Yu"
    venue_full: "European Conference on Machine Learning and Principles and Practice of Knowledge Discovery in Databases"
    venue_abbr: "ECML-PKDD"
    year: 2024
    accent: "#a61e4d"
    teaser_label: "AI4Science Transfer"
    teaser_caption: "Hard negative design for protein modeling"
    links:
      - label: "Paper"
        url: "https://arxiv.org/abs/2405.17902"
    summary:
      - "We introduce negative sample mining for protein language models by constructing hard negatives from protein pairs across distinct categories."
      - "The approach improves downstream performance and shows better alignment with biological mechanisms such as protein-protein interaction."
    key_insight: "Domain-aware hard negatives can steer protein LMs away from shortcut co-evolution cues and toward biologically meaningful structure."
    why_it_matters: "It demonstrates how graph-inspired learning principles can transfer to high-impact scientific problems."
    trajectory_relation: "This is a cross-domain branch showing how my graph learning principles scale into AI4Science."
    tags: ["AI4Science", "Protein LM", "ECML-PKDD"]

  - id: "persistent-homology-pooling"
    title: "Boosting Graph Pooling with Persistent Homology"
    authors: "Chaolong Ying, Xinjian Zhao, Tianshu Yu"
    venue_full: "Conference on Neural Information Processing Systems"
    venue_abbr: "NeurIPS"
    year: 2024
    accent: "#d9480f"
    teaser_label: "Topological Priors"
    teaser_caption: "Persistent homology for graph pooling"
    links:
      - label: "Paper"
        url: "https://arxiv.org/pdf/2402.16346"
    summary:
      - "We propose a graph pooling mechanism that injects persistent homology directly into coarsening, motivated by the alignment between PH filtration and cutoff-style pooling."
      - "The method is plug-and-play across pooling families and yields consistent, substantial gains on standard benchmarks."
    key_insight: "Topological priors are most effective when embedded in pooling itself, rather than appended as auxiliary features."
    why_it_matters: "It advances pooling from heuristic compression toward structure-preserving abstraction."
    trajectory_relation: "This work anchors my trajectory on injecting geometric/topological priors into representation pipelines."
    tags: ["Topology", "Graph Pooling", "NeurIPS"]

  - id: "adversarial-curriculum"
    title: "Adversarial Curriculum Graph Contrastive Learning with Pair-wise Augmentation"
    authors: "Xinjian Zhao, Liang Zhang, Yang Liu, Ruocheng Guo, Xiangyu Zhao"
    venue_full: "Preprint"
    year: 2024
    accent: "#1864ab"
    teaser_label: "Curriculum Robustness"
    teaser_caption: "Adversarial scheduling for graph contrastive learning"
    links:
      - label: "Paper"
        url: "https://arxiv.org/abs/2402.10468"
    summary:
      - "We propose ACGCL, combining pair-wise augmentation with controllable similarity and subgraph contrastive learning for graph-level representation learning."
      - "An adversarial curriculum progressively increases sample difficulty and focuses optimization on harder examples, outperforming strong baselines on six benchmarks."
    key_insight: "Graph contrastive learning becomes more reliable when similarity and sample difficulty are explicitly controlled during training."
    why_it_matters: "It offers a practical recipe for making graph contrastive methods less fragile."
    trajectory_relation: "This paper marks an early stage of my long-term branch on robustness-aware representation learning."
    tags: ["Contrastive Learning", "Robustness", "Preprint"]

trajectory:
  trunk:
    title: "Core Research Trunk: Structure-Aware Intelligence"
    description: "Core question: how can models learn and understand graph structure, and how can graph structure in turn improve general-purpose models and intelligence?"
  branches:
    - title: "Towards Graph Foundation Models"
      period: "2023-2026"
      focus: "Capability diagnostics and model-side evidence for graph foundation models."
      nodes:
        - paper_id: "adversarial-curriculum"
          label: "Adversarial Curriculum GCL (Preprint 2024)"
          one_line: "Introduces training curricula for robust contrastive learning."
        - paper_id: "spectral-augmentation"
          label: "Spectral Augmentation Revisited (TMLR 2025)"
          one_line: "Clarifies augmentation principles for stable SSL."
        - paper_id: "distributional-layouts"
          label: "Distributional Edge Layouts (KDD 2025)"
          one_line: "Models topology as distributions for uncertainty-aware learning."
        - paper_id: "vision-power"
          label: "Vision Models for Graph Structure (NeurIPS 2025)"
          one_line: "Tests where structural reasoning can emerge in non-graph-native backbones."
    - title: "Graph-Augmented Intelligence"
      period: "2024-2026"
      focus: "Using graph structure to diagnose and improve general intelligence."
      nodes:
        - paper_id: "graphomni"
          label: "GraphOmni (ICLR 2026)"
          one_line: "Decomposes graph reasoning into inspectable sub-skills."
        - paper_id: "vision-graphs-survey"
          label: "When Vision Meets Graphs (Survey 2026)"
          one_line: "Synthesizes capability gaps and future agenda."
    - title: "Structure Priors in Scientific and Real-World Applications"
      period: "2024-2026"
      focus: "Injecting structure priors into scientific and real-world applications, including AI4Science and recommender systems."
      nodes:
        - paper_id: "persistent-homology-pooling"
          label: "Persistent Homology Pooling (NeurIPS 2024)"
          one_line: "Injects topological signals to preserve global structure."
        - paper_id: "protein-negative-mining"
          label: "Negative Mining for Protein LMs (ECML-PKDD 2024)"
          one_line: "Uses structure-aware negatives to improve scientific representation quality."
        - anchor: "work-aot-star"
          label: "AOT* (ACL Findings 2026)"
          one_line: "LLM-empowered AND-OR tree search for efficient synthesis planning."
        - paper_id: "forge-manufacturing"
          label: "FORGE (Preprint 2026)"
          one_line: "Benchmarks multimodal models in realistic manufacturing scenarios."

cross_paper_insights:
  - title: "Reliable progress needs capability decomposition."
    detail: "Across GraphOmni and model analyses, aggregate scores hide critical weaknesses. Fine-grained diagnostics are necessary for trustworthy model comparison."
  - title: "Structural priors are most valuable under uncertainty."
    detail: "From distributional layouts to topology-aware pooling, methods that explicitly encode structure tend to be more robust when graphs are noisy or incomplete."
  - title: "Representation stability is a design target, not a byproduct."
    detail: "Curriculum learning and augmentation design jointly control whether learned embeddings survive perturbations and transfer across tasks."
  - title: "Graph learning principles transfer beyond canonical graph benchmarks."
    detail: "AI4Science applications show that structure-aware strategies can improve data efficiency and scientific validity in new domains."

