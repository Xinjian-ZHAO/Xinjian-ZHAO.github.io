  loop_title: "The Representation–Generation Loop"
  connections:
    - title: "Generation → Representation"
      paper_id: "molemb"
      label: "MolEmb"
      description: "Adapting generative models into representation learners."
    - title: "Representation → Generation"
      paper_id: "latent-jepa"
      label: "Latent JEPA"
      description: "Learning predictive representations for reasoning and generation."

cross_paper_insights:
  - title: "Reliable progress needs capability decomposition."
    detail: "Across GraphOmni and model analyses, aggregate scores hide critical weaknesses. Fine-grained diagnostics are necessary for trustworthy model comparison."
  - title: "Structural priors are most valuable under uncertainty."
    detail: "From distributional layouts to topology-aware pooling, methods that explicitly encode structure tend to be more robust when graphs are noisy or incomplete."
  - title: "Representation stability is a design target, not a byproduct."
    detail: "Curriculum learning and augmentation design jointly control whether learned embeddings survive perturbations and transfer across tasks."
  - title: "Graph learning principles transfer beyond canonical graph benchmarks."
    detail: "AI4Science applications show that structure-aware strategies can improve data efficiency and scientific validity in new domains."

additional_works:
  - id: "work-loopmol"
    teaser_label: "Closed-Loop Molecular Design"
    tags: ["Molecular Generation", "LLM Surrogates", "Optimization"]
    title: "Closed-Loop Molecular Inverse Design with Semantic LLM Surrogates"
    venue: "Preprint"
    year: 2026
    url: "https://arxiv.org/abs/2608.22967"
    authors: "Yaoyao Xu, Xinjian Zhao, Xiaozhuang Song, Lei Bai, Tianshu Yu"
    contribution: "LoopMol uses an LLM surrogate to select reference molecules and optional textual guidance from optimization histories and oracle feedback. This closes the generation–evaluation loop and improves the yield of molecules matching target properties."
  - id: "work-coverage-control"
    teaser_label: "Controllable Retrosynthesis"
    tags: ["Molecular Generation", "Instruction Following"]
    title: "Coverage Before Control: Route-Instruction Grounding and Steering for Controllable Retrosynthesis"
    venue: "Preprint"
    year: 2026
    url: "https://arxiv.org/abs/2609.39955"
    authors: "Xuemin Chen, Xiaozhuang Song, Xinjian Zhao, Yaoyao Xu, Tianshu Yu"
    contribution: "RIGS grounds instructions in alternative precursor sets, then steers a frozen retrosynthesis model with lightweight adapters to follow those preferences."
  - id: "work-retrogef"
    teaser_label: "Graph Edit Generation"
    tags: ["Graph Generation", "Retrosynthesis"]
    title: "RetroGEF: Dynamic Graph Edit Flow for Single-Step Retrosynthesis"
    venue: "Preprint"
    year: 2026
    url: "https://arxiv.org/abs/2609.38484"
    authors: "Xiaozhuang Song, Xuemin Chen, Xinjian Zhao, Yaoyao Xu, Tianshu Yu"
    contribution: "RetroGEF jointly generates atom additions and bond edits in a dynamic graph flow, learning retrosynthesis without a fixed graph size or prescribed edit order."
  - id: "work-chemopd"
    teaser_label: "Chemical Reasoning"
    tags: ["Distillation", "Reasoning", "AI4Science"]
    title: "ChemOPD: Multi-Teacher On-Policy Distillation for Multi-Task Chemical Reasoning"
    venue: "Preprint"
    year: 2026
    url: "https://arxiv.org/abs/2609.33838"
    authors: "Yaoyao Xu, Xinjian Zhao, Xiaozhuang Song, Xuemin Chen, Tianshu Yu"
    contribution: "ChemOPD groups chemical tasks by gradient affinity and combines specialist guidance with a generalist anchor to transfer complementary capabilities into one student."
  - id: "work-trl-bench"
    teaser_label: "Tabular Representations"
    tags: ["Representation Learning", "Benchmark"]
    title: "TRL-Bench: Standardizing Cross-Paradigm Representation-Level Evaluation of Tabular Encoders"
    venue: "Evaluations & Datasets Track"
    venue_abbr: "NeurIPS"
    year: 2026
    url: "https://arxiv.org/abs/2606.09323"
    authors: "Wei Pang, Xiangru Jian, Hehan Li, Zhixuan Yu, Alex Xue, Jinyang Li, Zhengyuan Dong, Xinjian Zhao, Hao Xu, Chao Zhang, Reynold Cheng, M. Tamer Özsu, Tianshu Yu"
    contribution: "TRL-Bench compares row, column, and table embeddings under shared evaluation conditions, showing that encoder strengths depend on the capability and pipeline stage."
  - id: "work-ht-gnn"
    teaser_label: "Temporal Graph Learning"
    tags: ["Temporal Graphs", "Industrial Applications"]
    title: "HT-GNN: Hyper-Temporal Graph Neural Network for Customer Lifetime Value Prediction in Baidu Ads"
