about:
  bio:
    - "I am a fourth-year PhD student in Computer Science at The Chinese University of Hong Kong, Shenzhen, and I am fortunate to be advised by <a href=\"https://mypage.cuhk.edu.cn/academics/yutianshu/\" target=\"_blank\" rel=\"noopener noreferrer\">Prof. Tianshu Yu</a>. During my PhD, I also spent time as a visiting student at the Institute of Automation, Chinese Academy of Sciences, hosted by <a href=\"https://people.ucas.ac.cn/~shuwu\" target=\"_blank\" rel=\"noopener noreferrer\">Prof. Shu Wu</a>, and as a research intern at Shanghai Artificial Intelligence Laboratory."
    - "Before my PhD, I completed an M.S. in Data Science at City University of Hong Kong under the supervision of <a href=\"https://rguo12.github.io/\" target=\"_blank\" rel=\"noopener noreferrer\">Prof. Ruocheng Guo</a> and a B.S. in Computer Science at Shandong University under the supervision of <a href=\"https://xuemengsong.github.io/\" target=\"_blank\" rel=\"noopener noreferrer\">Prof. Xuemeng Song</a>."

research_themes:
  - title: "Vision-Native Structural Understanding"
    question: "Can vision models recover graph topology and higher-order structure without explicit message passing?"
    method: "Cross-modal probing, structure-sensitive evaluation, and model behavior analysis."
    application: "Unified reasoning over visualized scientific/engineering structures."
  - title: "Efficient and Robust Graph Representation Learning"
    question: "How can graph embeddings remain useful under perturbation, distribution shift, and limited supervision?"
    method: "Contrastive learning, augmentation design, and topology-aware regularization."
    application: "Scalable learning for sparse, noisy, and dynamic graph data."
  - title: "Benchmarking for Graph Reasoning Agents"
    question: "What capabilities do LLM-centered systems truly have on graph-theoretic tasks?"
    method: "Large-scale benchmark construction, taxonomy design, and diagnostic task suites."
    application: "Trustworthy evaluation for graph-capable foundation models."
  - title: "AI4Science and Real-World Decision Systems"
    question: "How can structured priors improve sample efficiency and scientific validity?"
    method: "Negative sample mining, structural constraints, and domain-aware model adaptation."
    application: "Protein modeling, recommendation systems, and industrial optimization."

papers:
  - id: "latent-jepa"
    title: "Latent JEPA: Abstract Future Prediction for Latent Reasoning in Chemistry"
    authors: "Xinjian Zhao, Yaoyao Xu, Xuemin Chen, Xiaozhuang Song, Tianshu Yu"
    venue_full: "Preprint"
    year: 2026
    accent: "#806a93"
    teaser_label: "Latent Chemical Reasoning"
    teaser_caption: "Learning to anticipate molecular outcomes"
    links:
      - label: "Paper"
        url: "https://arxiv.org/abs/2610.01947"
    contribution: "Latent JEPA trains continuous reasoning states to predict representations of future reasoning and molecular outcomes. This improves chemical reasoning and makes latent thoughts more informative about molecular structure."
    tags: ["Latent Reasoning", "JEPA", "AI4Science"]

  - id: "molemb"
    title: "MolEmb: Multimodal Large Language Models Can Be Strong Molecular Embedding Models"
    authors: "Xinjian Zhao, Xiangru Jian, Yaoyao Xu, Xiaozhuang Song, Wei Pang, Lei Bai, Tianshu Yu"
    venue_full: "FM4LS@ICML"
    venue_display: "Working Paper · FM4LS@ICML 2026"
    venue_emphasis: "ICML"
    year: 2026
    accent: "#2f6f73"
    teaser_label: "Molecular Embeddings"
    teaser_caption: "MLLMs as context-aware molecular embedding backbones"
    links:
      - label: "Paper"
        url: "https://arxiv.org/abs/2608.23646"
      - label: "Workshop PDF"
        url: "/files/MolEmb%202026.pdf"
    contribution: "MolEmb adapts multimodal LLMs into molecular embedding models through molecule–text contrastive alignment. A shared embedding space supports property prediction and cross-modal retrieval, while MolCAR tests whether representations respond to scientific context."
    why_it_matters: "It points toward retrieval-centered molecular foundation models for drug discovery and reaction planning."
    trajectory_relation: "This work connects my graph representation learning thread with multimodal AI4Science systems."
    tags: ["Molecular ML", "MLLM", "Embedding"]

  - id: "vision-graphs-survey"
    title: "When Vision Meets Graphs: A Survey on Graph Reasoning and Learning"
    authors: "Xinjian Zhao, Wei Pang, Zhixuan Yu, Xiangru Jian, Xiaozhuang Song, Yaoyao Xu, Zhongkai Xue, Dingshuo Chen, Shu Wu, Philip Torr, Tianshu Yu"
    venue_full: "The 35th International Joint Conference on Artificial Intelligence"
    venue_abbr: "IJCAI"
    year: 2026
    accent: "#3b5bdb"
    teaser_label: "Position"
    teaser_caption: "Visual intelligence for graph reasoning and learning"
    links:
      - label: "Paper"
        url: "https://arxiv.org/abs/2609.03816"
    contribution: "We organize vision-based graph research into graph reasoning, graph learning, and scientific applications. The paper argues for treating graph depictions as direct model inputs and identifies open challenges toward graph foundation models."
    why_it_matters: "It clarifies a forward research agenda and identifies where new benchmarks and models are most needed."
    trajectory_relation: "This is a synthesis node that integrates observations from multiple branches of my prior work."
    tags: ["Survey", "Vision", "Graph ML"]

  - id: "vision-power"
    title: "The Underappreciated Power of Vision Models for Graph Structural Understanding"
    authors: "Xinjian Zhao*, Wei Pang*, Zhongkai Xue*, Xiangru Jian*, Lei Zhang, Yaoyao Xu, Xiaozhuang Song, Shu Wu, Tianshu Yu"
    venue_full: "Conference on Neural Information Processing Systems"
    venue_abbr: "NeurIPS"
    year: 2025
    accent: "#495057"
    teaser_label: "Structure via Visual Intelligence"
    teaser_caption: "How far vision models can reason about graph structure"
    links:
      - label: "Paper"
        url: "https://arxiv.org/pdf/2510.24788"
    contribution: "We show that vision models can compete with GNNs on graph-level tasks using rendered graphs. GraphAbstract reveals strengths in global structural perception and scale-invariant reasoning that complement local message passing."
    why_it_matters: "It opens a practical route to leverage mature vision architectures for graph reasoning tasks."
    trajectory_relation: "This paper extends the GraphOmni diagnosis into model-side evidence about where structural reasoning emerges."
    tags: ["Vision Models", "Structural Reasoning", "NeurIPS"]

  - id: "distributional-layouts"
    title: "Graph Learning with Distributional Edge Layouts"
    authors: "Xinjian Zhao, Chaolong Ying, Yaoyao Xu, Tianshu Yu"
    venue_full: "ACM SIGKDD Conference on Knowledge Discovery and Data Mining"
    venue_abbr: "KDD"
    year: 2025
    accent: "#087f5b"
    teaser_label: "Distributional Geometry"
    teaser_caption: "Edge layout distributions as structural priors"
    links:
      - label: "Paper"
        url: "https://arxiv.org/abs/2402.16402"
    contribution: "DEL represents graph structure through distributions of physically simulated edge layouts. These structural features help distinguish hard graph pairs and improve GNN and Graph Transformer representations."
    why_it_matters: "Many real data pipelines induce imperfect graphs; distributional layouts make methods less brittle in those settings."
    trajectory_relation: "This is a core branch in my trajectory on robust graph representation under imperfect structure."
    tags: ["Graph Representation", "Robustness", "KDD"]

  - id: "adversarial-curriculum"
    title: "Adversarial Curriculum Graph Contrastive Learning with Pair-wise Augmentation"
    authors: "Xinjian Zhao, Liang Zhang, Yang Liu, Ruocheng Guo, Xiangyu Zhao"
    venue_full: "Preprint"
    year: 2024
    accent: "#1864ab"
    teaser_label: "Graph Contrastive Learning"
    teaser_caption: "Adversarial scheduling for graph contrastive learning"
    links:
      - label: "Paper"
        url: "https://arxiv.org/abs/2402.10468"
    contribution: "ACGCL generates graph pairs with controllable similarity and progressively increases training difficulty through an adversarial curriculum. Jointly controlling augmentation and sample difficulty improves graph contrastive learning."
    why_it_matters: "It offers a practical recipe for making graph contrastive methods less fragile."
    trajectory_relation: "This paper marks an early stage of my long-term branch on robustness-aware representation learning."
    tags: ["Contrastive Learning", "Robustness", "Preprint"]

  - id: "embedding-survey"
    legacy_anchor: "work-embedding-survey"
    title: "Embedding in Recommender Systems: A Survey"
    authors: "Maolin Wang*, Xinjian Zhao*, Wanyu Wang*, Sheng Zhang, Jiansheng Li, Bowen Yu, Binhao Wang, Shucheng Zhou, Dawei Yin, Qing Li, Ruocheng Guo, Xiangyu Zhao"
    venue_full: "ACM Transactions on Information Systems"
    venue_abbr: "TOIS"
    year: 2026
    accent: "#806a93"
    teaser_label: "Representation in Recommendation"
    links:
      - label: "Paper"
        url: "https://arxiv.org/pdf/2310.18608.pdf"
    contribution: "We survey embedding methods for recommender systems, organizing representation techniques and their roles in recommendation pipelines."
    tags: ["Representation Learning", "Recommendation", "Survey"]

  - id: "graphomni"
    title: "GraphOmni: A Comprehensive and Extensible Benchmark Framework for Large Language Models on Graph-theoretic Tasks"
    authors: "Hao Xu*, Xiangru Jian*, Xinjian Zhao*, Wei Pang*, Chao Zhang, Suyuchen Wang, Qixin Zhang, Zhengyuan Dong, Joao Monteiro, Bang Liu, Qiuzhuang Sun, Tianshu Yu"
    venue_full: "International Conference on Learning Representations"
    venue_abbr: "ICLR"
    year: 2026
    accent: "#0b7285"
    teaser_label: "Graph Reasoning Diagnostics"
    teaser_caption: "Graph-theoretic capabilities of LLM systems"
    links:
      - label: "Paper"
        url: "https://openreview.net/forum?id=dc8Kf2g0KC"
    contribution: "GraphOmni evaluates LLM graph reasoning across graph types, input representations, and prompting strategies. It reveals configuration-dependent failures and introduces an adaptive selector to find effective settings with limited exploration."
    why_it_matters: "It provides a more reliable basis for comparing model families and choosing where algorithmic effort should go."
    trajectory_relation: "This work establishes the evaluation spine for my later studies on structure understanding and model bias."
    tags: ["LLM", "Graph Reasoning", "Benchmark"]

  - id: "spectral-augmentation"
    title: "Rethinking Spectral Augmentation for Contrast-based Graph Self-Supervised Learning"
    authors: "Xiangru Jian*, Xinjian Zhao*, Wei Pang*, Chaolong Ying, Yimu Wang, Yaoyao Xu, Tianshu Yu"
    venue_full: "Transactions on Machine Learning Research"
    venue_abbr: "TMLR"
    year: 2025
    accent: "#5f3dc4"
    teaser_label: "Spectral Views"
    teaser_caption: "Augmentation choices in graph contrastive learning"
    links:
      - label: "Paper"
        url: "https://openreview.net/pdf?id=HjpD5kpfa3"
    contribution: "We find that perturbation strength, rather than spectral characteristics, often dominates contrastive learning with shallow GNNs. This explains why simple edge perturbations can match or outperform more elaborate spectral augmentations."
    why_it_matters: "It improves SSL stability and reduces trial-and-error in representation learning pipelines."
    trajectory_relation: "This contributes mechanistic understanding in my branch on efficient, principled representation learning."
    tags: ["Graph SSL", "Spectral Methods", "TMLR"]

  - id: "protein-negative-mining"
    title: "Boosting Protein Language Models with Negative Sample Mining"
    authors: "Yaoyao Xu*, Xinjian Zhao*, Xiaozhuang Song, Benyou Wang, Tianshu Yu"
    venue_full: "European Conference on Machine Learning and Principles and Practice of Knowledge Discovery in Databases"
    venue_abbr: "ECML-PKDD"
    year: 2024
    accent: "#a61e4d"
    teaser_label: "Protein Language Models"
    teaser_caption: "Negative alignment for protein modeling"
    links:
      - label: "Paper"
        url: "https://arxiv.org/abs/2405.17902"
    contribution: "We improve protein language models by mining negative protein pairs and reducing their residue-level alignment. This discourages misleading co-evolution correlations and improves discrimination on downstream protein tasks."
    why_it_matters: "It demonstrates how graph-inspired learning principles can transfer to high-impact scientific problems."
    trajectory_relation: "This is a cross-domain branch showing how my graph learning principles scale into AI4Science."
    tags: ["AI4Science", "Protein LM", "ECML-PKDD"]

  - id: "forge-manufacturing"
    title: "FORGE: Fine-grained Multimodal Evaluation for Manufacturing Scenarios"
    authors: "Xiangru Jian, Hao Xu, Wei Pang, Xinjian Zhao, Chengyu Tao, Qixin Zhang, Xikun Zhang, Chao Zhang, Guanzhi Deng, Alex Xue, Juan Du, Tianshu Yu, Garth Tarr, Linqi Song, Qiuzhuang Sun, Dacheng Tao"
    venue_full: "Findings of the Association for Computational Linguistics: EMNLP 2026"
    venue_display: "Findings of EMNLP 2026"
    venue_emphasis: "EMNLP"
    year: 2026
    accent: "#8f5b2e"
    teaser_label: "Manufacturing MLLMs"
    teaser_caption: "Fine-grained multimodal evaluation in industrial scenarios"
    links:
      - label: "Paper"
        url: "https://arxiv.org/abs/2604.07413"
      - label: "Website"
        url: "https://ai4manufacturing.github.io/forge-web/"
    contribution: "FORGE evaluates 18 multimodal models on manufacturing tasks using real images, 3D point clouds, and fine-grained annotations. It identifies missing domain knowledge as the main bottleneck and shows that domain-specific training can improve performance."
    why_it_matters: "It provides a realistic evaluation and adaptation pathway for multimodal models in industrial environments."
    trajectory_relation: "This work extends my interest in graph-augmented intelligence and structured evaluation into high-value manufacturing scenarios."
    tags: ["Manufacturing", "MLLM", "Benchmark"]

  - id: "persistent-homology-pooling"
    title: "Boosting Graph Pooling with Persistent Homology"
    authors: "Chaolong Ying, Xinjian Zhao, Tianshu Yu"
    venue_full: "Conference on Neural Information Processing Systems"
    venue_abbr: "NeurIPS"
    year: 2024
    accent: "#d9480f"
    teaser_label: "Topological Priors"
    teaser_caption: "Persistent homology for graph pooling"
    links:
      - label: "Paper"
        url: "https://arxiv.org/pdf/2402.16346"
    contribution: "We incorporate persistent homology into graph pooling so that topological information guides which structure survives coarsening. This helps preserve global structure in learned graph representations."
    why_it_matters: "It advances pooling from heuristic compression toward structure-preserving abstraction."
    trajectory_relation: "This work anchors my trajectory on injecting geometric/topological priors into representation pipelines."
    tags: ["Topology", "Graph Pooling", "NeurIPS"]

trajectory:
