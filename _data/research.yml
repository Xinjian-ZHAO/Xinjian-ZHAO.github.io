    url: "https://arxiv.org/abs/2601.13013"
    authors: "Xiaohui Zhao, Xinjian Zhao, Jiahui Zhang, Guoyu Liu, Houzhi Wang, Shu Wu"
    contribution: "HT-GNN combines hypergraph supervision, temporal modeling, and task-adaptive experts to predict customer lifetime value across multiple time horizons."
  - id: "work-aot-star"
    teaser_label: "Synthesis Planning"
    tags: ["LLM", "Tree Search", "Planning"]
    title: "AOT*: Efficient Synthesis Planning via LLM-Empowered AND-OR Tree Search"
    venue: "Findings of the Association for Computational Linguistics"
    venue_abbr: "ACL Findings"
    year: 2026
    url: "https://aclanthology.org/2026.findings-acl.1734/"
    authors: "Xiaozhuang Song, Xuanhao Pan, Xinjian Zhao, Hangting Ye, Shufei Zhang, Jian Tang, Tianshu Yu"
    contribution: "AOT* combines LLM-generated synthesis routes with AND-OR tree search, achieving competitive solve rates with fewer search iterations."

