profile:
  name: "Xinjian Zhao (赵鑫鉴)"
  current_role: "PhD Candidate in Computer Science"
  affiliation: "The Chinese University of Hong Kong, Shenzhen"
  advisor: "Advised by Prof. Tianshu Yu"
  photo: "/images/profile.png"
  one_liner: "I study graph machine learning and AI methods that improve structural reasoning in scientific and real-world systems."
  intro:
    - "My work focuses on how models represent graph structure, adapt under data shift, and transfer across modalities."
    - "Across benchmarks, learning algorithms, and AI4Science applications, I aim to turn empirical performance gains into reusable research principles."
  location: "Shenzhen, China"

